# CodeQL code scanning for the TypeScript sources and for the workflows themselves.
# Runs on every push to main (the baseline PR results are compared against), weekly, and on
# pull requests that change code CodeQL reads (JavaScript/TypeScript files or workflows), not on
# every pull request commit. The actions language stays: it costs about one Linux minute per
# run and scans the workflows that hold publish rights (release.yml) for injection.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
