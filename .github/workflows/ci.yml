# Pull request and main-branch checks. The `gate` job is the single required status check.
#
# Pull requests run one Linux job on Node 22 (the engines minimum): lint, typecheck, shape, knip,
# build, tests with coverage, pack smoke test, publint, and the docs checks when their inputs
# changed. Pushes to main add Node 24 on Linux. macOS runs weekly and on manual dispatch: it
# was 77% of the Linux-equivalent minutes (10x multiplier) and, over the first 39 runs, never
# failed apart from Linux.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: the full set, macOS included.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu-latest, node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a pull request HEAD is the merge commit and HEAD^1 the base-branch tip, so
          # `git diff HEAD^1` is exactly the change the pull request makes.
          fetch-depth: 2

      # The docs checks compare the committed captures and CLI tables with what dist/cli.js
      # prints, so the CLI's inputs (sources, fixtures, dependencies, bundler config) count as
      # docs inputs too. No base to diff against (schedule, dispatch, forced push): run them.
      - name: Changed files (do the docs checks run?)
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="HEAD^1"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            if git fetch --no-tags --depth=1 origin "$BEFORE"; then base="$BEFORE"; fi
          fi
          if [ -z "$base" ]; then
            echo "No base to diff against ($EVENT): the docs checks run."
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$changed"
          pattern='^(docs/|brand/|src/|test/fixtures/|README\.md$|package(-lock)?\.json$|ts(config\.json|down\.config\.ts)$|\.github/workflows/ci\.yml$)'
          if grep -qE "$pattern" <<<"$changed"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "No docs input changed: the docs checks are skipped."
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - run: npm ci

      - name: Lint (format check + lint ratchet + no provider-shaped secret literal)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Function shape ratchet
        run: npm run check:shape

      - name: Unused code and dependencies (knip)
        run: npm run knip

      - name: Build
        id: build
        run: npm run build

      # The tests' globalSetup would build dist/ a second time; they test this build instead.
      - name: Tests with coverage
        env:
          PALM_SKIP_DIST_BUILD: '1'
        run: npm run test:coverage

      - name: Upload coverage (lcov)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Pack, install the tarball globally and smoke-test palm
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          prefix="$RUNNER_TEMP/palm-smoke"
          tarball="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          cd "$RUNNER_TEMP"
          npm install --global --prefix "$prefix" "$tarball"
          export PATH="$prefix/bin:$PATH"
          expected="$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').version")"
          actual="$(palm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::palm --version printed '$actual', expected '$expected'"
            exit 1
          fi
          palm --help

      - name: Package lint (publint)
        run: npx publint

      # Advisory: a PR without a changeset gets a warning, not a failure, so dependency bumps
      # and internal changes are not blocked. User-visible changes still need one.
      - name: Check for a changeset
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if ! npx changeset status --since=HEAD^1; then
            msg="No changeset in this PR. If users can see the change, run 'npx changeset'."
            echo "::warning::$msg Otherwise ignore this, or run 'npx changeset --empty'."
          fi

      # Docs checks: terminal captures and CLI option tables generated from dist/cli.js must
      # match the CLI, and the site must build (STYLE.md copy check and internal link check
      # included). They run whenever the build succeeded, so a failing test does not hide them.
      - name: Install the docs site dependencies
        if: ${{ !cancelled() && steps.changes.outputs.docs == 'true' && steps.build.outcome == 'success' }}
        run: npm --prefix docs ci

      - name: CLI reference is up to date
        if: ${{ !cancelled() && steps.changes.outputs.docs == 'true' && steps.build.outcome == 'success' }}
        run: npm --prefix docs run cli-reference:check

      - name: Terminal captures are up to date
        if: ${{ !cancelled() && steps.changes.outputs.docs == 'true' && steps.build.outcome == 'success' }}
        run: npm --prefix docs run capture:check

      - name: Build the site (brand assets, copy check, link check)
        if: ${{ !cancelled() && steps.changes.outputs.docs == 'true' && steps.build.outcome == 'success' }}
        run: npm --prefix docs run build

  # After the Linux job passed: Node 24 on Linux for every push to main; Node 24 on Linux and
  # macOS on Node 22 weekly and on manual dispatch. Platform-independent checks (lint, types,
  # shape, knip, docs) ran in the test job already.
  # No matrix expression in the name: a job skipped by `if` is never expanded, so a templated
  # name would show raw on pull requests. GitHub appends the matrix values itself.
  compat:
    name: compat
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'push' && '{"include":[{"os":"ubuntu-latest","node":24}]}' || '{"include":[{"os":"ubuntu-latest","node":24},{"os":"macos-latest","node":22}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        env:
          PALM_SKIP_DIST_BUILD: '1'
        run: npm test

      - name: Pack, install the tarball globally and smoke-test palm
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          prefix="$RUNNER_TEMP/palm-smoke"
          tarball="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          cd "$RUNNER_TEMP"
          npm install --global --prefix "$prefix" "$tarball"
          export PATH="$prefix/bin:$PATH"
          expected="$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').version")"
          actual="$(palm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::palm --version printed '$actual', expected '$expected'"
            exit 1
          fi
          palm --help

  # Pull requests only: the one check the ruleset requires, so it never has to list job names.
  # It passes only when the test job passed (the docs checks are steps in it, skipped when no
  # docs input changed).
  gate:
    name: gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The test job passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "test: $TEST_RESULT"
          [ "$TEST_RESULT" = success ]
