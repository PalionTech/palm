# Pull request and main-branch checks. The `gate` job is the single required status check:
# it passes only when every matrix leg and the docs checks passed, so the ruleset never has to
# list job names.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint (format check + lint ratchet)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Function shape ratchet
        run: npm run check:shape

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Upload coverage (lcov)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      - name: Install the packed tarball and smoke-test palm
        run: |
          prefix="$RUNNER_TEMP/palm-smoke"
          tarball="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          cd "$RUNNER_TEMP"
          npm install --global --prefix "$prefix" "$tarball"
          export PATH="$prefix/bin:$PATH"
          expected="$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').version")"
          actual="$(palm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::palm --version printed '$actual', expected '$expected'"
            exit 1
          fi
          palm --help

      - name: Package lint (publint)
        run: npx publint

      - name: Unused code and dependencies (knip)
        run: npm run knip

  changeset:
    name: changeset status
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Advisory: a PR without a changeset gets a warning, not a failure, so dependency bumps
      # and internal changes are not blocked. User-visible changes still need one.
      - name: Check for a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! npx changeset status --since="origin/$BASE_REF"; then
            msg="No changeset in this PR. If users can see the change, run 'npx changeset'."
            echo "::warning::$msg Otherwise ignore this, or run 'npx changeset --empty'."
          fi

  # The docs show real palm output: terminal captures and CLI option tables generated from
  # dist/cli.js. This job fails when any of them no longer matches the CLI, and builds the site
  # (STYLE.md copy check and internal link check included).
  docs:
    name: docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - run: npm ci

      - name: Build the CLI (captures and the CLI reference run dist/cli.js)
        run: npm run build

      - run: npm --prefix docs ci

      - name: CLI reference is up to date
        run: npm --prefix docs run cli-reference:check

      - name: Terminal captures are up to date
        run: npm --prefix docs run capture:check

      - name: Build the site (brand assets, copy check, link check)
        run: npm --prefix docs run build

  gate:
    name: gate
    if: ${{ always() }}
    needs: [test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every matrix job and the docs checks passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          echo "test: $TEST_RESULT"
          echo "docs: $DOCS_RESULT"
          [ "$TEST_RESULT" = success ] && [ "$DOCS_RESULT" = success ]
