# Blocks pull requests that add dependencies with known vulnerabilities (moderate or worse)
# or with GPL/AGPL licences, which would conflict with palm's MIT licence for users.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # deny-licenses is deprecated upstream (actions/dependency-review-action#938). If a
      # future major removes it, switch to an allow-licenses list.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: >-
            GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later
