<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">palm: concept A, fan frond</title>
  <!-- Concept A (recommended): a fan-palm (palmetto) frond.
       Seven identical rounded leaflets, the "modules", spread from one stem:
       one origin, written to every harness. It is a plant, not a hand, a
       sparkle or a neural net, so it does not read as an AI-model brand.
       One colour (currentColor), no gradient or outline: works as a
       monochrome favicon, in print and at 16px. Under 20px, use a 5-leaflet
       cut (angles -60 -30 0 30 60, stroke 7) so the gaps stay open. -->
  <style>
    svg { color: #12876A; }
    @media (prefers-color-scheme: dark) { svg { color: #5CD6B0; } }
  </style>
  <g stroke="currentColor" stroke-linecap="round" fill="none">
    <!-- leaflets: fused at the base like a real fan palm -->
    <g stroke-width="6">
      <line x1="27.4" y1="42.0" x2="2.8" y2="31.0"/>
      <line x1="28.5" y1="40.4" x2="9.8" y2="21.0"/>
      <line x1="30.1" y1="39.4" x2="20.0" y2="14.3"/>
      <line x1="32.0" y1="39.0" x2="32.0" y2="12.0"/>
      <line x1="33.9" y1="39.4" x2="44.0" y2="14.3"/>
      <line x1="35.5" y1="40.4" x2="54.2" y2="21.0"/>
      <line x1="36.6" y1="42.0" x2="61.2" y2="31.0"/>
    </g>
    <!-- stem -->
    <line x1="32" y1="44" x2="32" y2="59" stroke-width="5"/>
  </g>
</svg>
