<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">palm: concept B, open hand holding a node graph</title>
  <!-- Concept B (not recommended): a palm-up hand, side view, holding three
       connected nodes (entities and their dependencies).
       Problems: hand + network graph is the stock "AI" pictogram, which
       leans into the Google PaLM association; the nodes merge into a blob
       below 24px; the hand needs detail to read as a hand. -->
  <style>
    svg { color: #12876A; }
    @media (prefers-color-scheme: dark) { svg { color: #5CD6B0; } }
  </style>
  <g fill="currentColor">
    <!-- cupped hand: thumb on the left, fingertips raised on the right -->
    <path d="M6 33 C6 28 11 26 13 29 L17 37 C19 40 22 41 26 41 L44 41
             C48 41 51 38 54 35 C56 33 59 34 59 37 C58 44 50 51 40 52
             L24 52 C14 52 7 44 6 33 Z"/>
    <!-- node graph: three entities, two dependency edges -->
    <g stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <line x1="22" y1="15" x2="32" y2="29"/>
      <line x1="42" y1="13" x2="32" y2="29"/>
      <line x1="22" y1="15" x2="42" y2="13"/>
    </g>
    <circle cx="22" cy="15" r="5"/>
    <circle cx="42" cy="13" r="5"/>
    <circle cx="32" cy="29" r="5"/>
  </g>
</svg>
